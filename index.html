<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Styling</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #222;
    }

    .color-box {
      padding: 2rem 3rem;
      border-radius: 12px;
      background-color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #2f6fed;
      margin: 0 0 0.5rem;
    }

    p {
      color: #4a4a4a;
      margin: 0;
    }

    .highlight {
      color: #d35400;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="color-box">
    <h1>Hello, World!</h1>
    <p>This text uses <span class="highlight">CSS color styling</span>.</p>
  </div>
</body>
</html>
